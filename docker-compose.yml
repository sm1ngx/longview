services:
  longview:
    build: .
    ports:
      - '127.0.0.1:3001:3001'
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: /data/longview.db
    volumes:
      - longview-data:/data
    restart: unless-stopped
volumes:
  longview-data:
